# Header navigation (top menu) - rendered in the listed order.
# "Home" is not listed: the site title in the header links to "/".
# Both shapes are supported by the theme's header.html:
#   - title: Home            (plain string)
#   - titles: {en: Home}     (locale map)
header:
  - title: Blog
    url: /blog/
  - title: Building
    url: /building/
  - title: Fiction
    url: /fiction/
  - title: About
    url: /about/

# Sidebar navigation for the fiction section.
# Activated on a story via the defaults block in _config.yml:
#   sidebar: { nav: fiction }
# Top-level entries render as headings, children as links
# (verified against _includes/sidebar/toc.html).
fiction:
  - title: Short Stories
    children:
      - title: The First Story
        url: /fiction/the-first-story/
