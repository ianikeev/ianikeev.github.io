---
layout: base.html
title: Fiction
description: Short stories and other fiction.
permalink: /fiction/
---

<main class="grid">
  <header>
    <h1>Fiction</h1>
  </header>

    <div class="grid --gap-md --gap-y-md">
    {% for story in collections.fiction %}
      <article class="span-1/3">
        <div class="item__content">
          <a class="item__header" href="{{ story.url }}">
            {{ story.data.title }}
          </a>
        </div>
      </article>
    {% endfor %}
  </div>
</main>
