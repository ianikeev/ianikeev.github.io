# ============================================================
# twoladsandacat.com - TeXt theme configuration (starter values)
# If you cloned the FULL theme repository, MERGE these values
# into your existing _config.yml instead of replacing the file.
# If you use remote_theme / start from scratch, use as-is.
# ============================================================

title: Two Lads and a Cat
description: >
  Stories, blog posts, and downloads from two lads and one cat.
url: https://twoladsandacat.com
baseurl: ""
lang: en
timezone: America/Argentina/Buenos_Aires

# Uncomment if you load the theme via remote_theme instead of a fork:
# remote_theme: kitian616/jekyll-TeXt-theme

author:
  type: person
  name: Your Name

# --- Blog pagination (classic jekyll-paginate, works at site root) ---
paginate: 8
paginate_path: /page:num

# --- Fiction collection: each file in _fiction/ becomes a page ---
collections:
  fiction:
    output: true
    permalink: /fiction/:name/

# --- Optional defaults: fiction files get article layout + sidebar ---
defaults:
  - scope:
      path: "_fiction"
      type: "fiction"
    values:
      layout: article
      sidebar:
        nav: fiction

# --- TeXt theme keys left at defaults (uncomment to override) ---
# text_skin: default           # default | dark | forest | ocean | chocolate | orange
# highlight_theme: default     # default | tomorrow | tomorrow-night | ...
# license: CC-BY-NC-4.0
# comments:
#   provider: disqus           # false (default) | disqus | gitalk | valine
