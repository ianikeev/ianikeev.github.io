# ============================================================
# twoladsandacat.com - adapted from the TeXt theme's canonical
# root configuration (theme master). All theme keys are present;
# site identity, the app block, the fiction collection and the
# skin were changed from the defaults.
# ============================================================

## => Site Settings
##############################
text_skin: clinic # "default", "dark", "forest", "ocean", "chocolate", "orange", or a custom skin in _sass/skins/
highlight_theme: default # "default" (default), "tomorrow", "tomorrow-night", ...
url     : https://twoladsandacat.com
baseurl : # does not include hostname
title   : Two Lads and a Cat
description: > #
  Building a medical information manager in the open - a build log,
  plus whatever else catches my attention.

## => Language and Timezone
##############################
lang: en
timezone: America/Argentina/Buenos_Aires

## => Author and Social
##############################
author:
  type      : person # "person" (default), "organization"
  name      : Igor Anikeev
  url       :
  avatar    : # path or url of avatar image (square) - a photo here warms up the landing page
  bio       : Building a medical information manager in the open.
  email     :

## => The App
##############################
## The app's name and status. Read as `site.app.name` / `site.app.status`
## on the landing page, /building/ and /about/ - change them here only.
app:
  name     : Niori
  one_liner: A home for your own medical history.
  status   : Early days - design and prototypes. Nothing to download yet.

## => GitHub Repository (optional - used for "edit on GitHub" links)
##############################
# repository: your-github-name/your-repo-name
# repository_tree: master

## => Paths
##############################
paths:
  root    : # title link url, "/" (default)
  home    : # home layout url, "/" (default)
  archive : # "/archive.html" (default)
  rss     : # "/feed.xml" (default)

## => Post
##############################
## excerpt
excerpt_separator: <!--more-->

## license
license: CC-BY-NC-SA-4.0 # "CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-NC-4.0", "CC-BY-NC-SA-4.0", "CC-BY-ND-4.0"
# Keys must exist in _data/licenses.yml - an unknown key renders no license block.

## TOC
toc:
  selectors: # "h1,h2,h3" (default)

## => Markdown Enhancements
##############################
mathjax: # false (default), true
mathjax_autoNumber: # false (default), true
mermaid: # false (default), true
chart: # false (default), true

## => Paginate (intentionally absent)
##############################
# No paginate / paginate_path keys: the homepage uses the landing
# layout and /blog/ lists all posts via the articles layout, so
# pagination is not needed. jekyll-paginate only attaches a paginator
# to a page named exactly index.html; an index.md homepage would
# never receive one.

## => Sources
##############################
sources: # bootcdn (default), unpkg

## => Sharing / Comments / Pageview / Analytics
##############################
sharing:
  provider: false # false (default), "addtoany", "addthis", "custom"
comments:
  provider: false # false (default), "disqus", "gitalk", "valine", "custom"
pageview:
  provider: false # false (default), "leancloud", "custom"
analytics:
  provider: false # false (default), "google", "custom"

## => Search
##############################
search:
  provider: default # "default" (default), false, "google", "custom"

## => Build
##############################
markdown    : kramdown
highlighter : rouge
permalink   : date

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - /vendor
  - /docs
  - /test
  - bin/ # icon/asset build scripts, not site content

## => Collections
##############################
## _fiction/ must be declared here or it is ignored entirely (the
## `defaults` block below has nothing to apply to, site.fiction is nil
## and /fiction/ renders empty). URLs become /fiction/<file-name>/.
collections:
  fiction:
    output: true
    permalink: /fiction/:path/ # without this the global `permalink: date` applies

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: true
      license: true
      aside:
        toc: true
      show_edit_on_github: false
      show_subscribe: true
      pageview: true
  - scope:
      path: "_fiction"
      type: "fiction"
    values:
      layout: article
      sharing: false
      license: true
      aside:
        toc: true
      show_edit_on_github: false
      sidebar:
        nav: fiction

## => Plugins (all whitelisted on GitHub Pages)
##############################
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
